<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">The last signal — hand against rain glass</title>
  <desc id="desc">A moody teal silhouette reaches toward a rain-streaked window while a sleeping city breaks into soft blue and amber bokeh beyond.</desc>
  <defs>
    <linearGradient id="tealNight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07151f"/>
      <stop offset=".42" stop-color="#10303a"/>
      <stop offset="1" stop-color="#1c4c50"/>
    </linearGradient>
    <linearGradient id="glassTone" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#528288" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#0e2732" stop-opacity=".08"/>
      <stop offset="1" stop-color="#071c29" stop-opacity=".52"/>
    </linearGradient>
    <linearGradient id="handShade" x1="0" y1="0" x2="1" y2=".25">
      <stop stop-color="#071c27"/>
      <stop offset=".44" stop-color="#0a2731"/>
      <stop offset=".72" stop-color="#123b42"/>
      <stop offset="1" stop-color="#071820"/>
    </linearGradient>
    <linearGradient id="fingerEdge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8bb9b0" stop-opacity=".04"/>
      <stop offset=".54" stop-color="#91beb2" stop-opacity=".43"/>
      <stop offset="1" stop-color="#58908f" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="blueBokeh"><stop stop-color="#93d5d4" stop-opacity=".8"/><stop offset=".42" stop-color="#4c9ca6" stop-opacity=".38"/><stop offset="1" stop-color="#2c6977" stop-opacity="0"/></radialGradient>
    <radialGradient id="amberBokeh"><stop stop-color="#f4c38a" stop-opacity=".84"/><stop offset=".4" stop-color="#d27555" stop-opacity=".36"/><stop offset="1" stop-color="#a7483e" stop-opacity="0"/></radialGradient>
    <filter id="bokeh" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="smallBokeh" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="glassBlur" x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="52"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .065"/></feComponentTransfer>
    </filter>
    <clipPath id="windowClip"><rect x="35" y="25" width="730" height="400" rx="2"/></clipPath>
  </defs>

  <rect width="800" height="450" fill="url(#tealNight)"/>

  <!-- vague, far city behind the glass -->
  <g opacity=".55">
    <path d="M0 288h44v-48h23v48h20v-94h31v94h17v-67h33v67h27v-114h35v114h21v-53h33v53h35v-92h22v92h28v-42h42v42h21v-127h26v127h34v-69h27v69h29v-101h38v101h25v-53h24v53h23v-77h32v77h31v-55h42v55h28v-91h28v91h25v162H0z" fill="#071921"/>
    <path d="M0 335c143-12 239 8 359-4 139-13 291 6 441-9v128H0z" fill="#06151c"/>
    <g fill="#a5dcce" opacity=".26">
      <rect x="53" y="259" width="4" height="14"/><rect x="112" y="231" width="4" height="17"/><rect x="140" y="254" width="4" height="12"/>
      <rect x="193" y="202" width="4" height="18"/><rect x="281" y="236" width="4" height="15"/><rect x="414" y="214" width="4" height="17"/>
      <rect x="499" y="242" width="4" height="16"/><rect x="592" y="229" width="4" height="17"/><rect x="707" y="251" width="4" height="14"/>
    </g>
  </g>
  <g filter="url(#bokeh)">
    <circle cx="92" cy="273" r="20" fill="url(#blueBokeh)"/><circle cx="184" cy="335" r="31" fill="url(#amberBokeh)"/>
    <circle cx="293" cy="263" r="16" fill="url(#blueBokeh)"/><circle cx="402" cy="317" r="28" fill="url(#blueBokeh)"/>
    <circle cx="536" cy="243" r="22" fill="url(#amberBokeh)"/><circle cx="668" cy="302" r="33" fill="url(#blueBokeh)"/>
    <circle cx="748" cy="215" r="15" fill="url(#amberBokeh)"/>
  </g>
  <g filter="url(#smallBokeh)" opacity=".8">
    <circle cx="128" cy="318" r="6" fill="#b8dcd4"/><circle cx="239" cy="288" r="8" fill="#e3a675"/><circle cx="340" cy="344" r="5" fill="#9bd2cb"/>
    <circle cx="475" cy="276" r="7" fill="#cf8361"/><circle cx="579" cy="328" r="6" fill="#a7d8cf"/><circle cx="718" cy="270" r="8" fill="#efb879"/>
  </g>

  <rect x="35" y="25" width="730" height="400" fill="url(#glassTone)"/>
  <path d="M29 27h738M30 425h738M35 25v400M765 25v400" fill="none" stroke="#9cc3bd" stroke-width="2" opacity=".15"/>

  <!-- reaching arm, cropped by the lower edge for a close, bodily frame -->
  <path d="M166 450c13-39 31-72 55-101 22-26 48-45 79-61 20-10 38-21 52-36 12-12 24-29 37-48l31-45c7-10 15-14 23-10 8 4 10 12 5 22l-25 49 5 5 52-88c6-10 14-14 22-10 9 4 10 12 5 22l-41 85 6 4 53-75c7-9 15-11 23-6 8 5 8 13 2 22l-43 73 7 5 42-52c8-9 16-10 23-4 7 6 5 14-2 23l-45 59c-8 10-13 19-14 27-2 13 6 26 20 39 14 12 26 24 34 36 16 24 28 55 35 91z" fill="url(#handShade)"/>
  <!-- open thumb and palm plane -->
  <path d="M463 252c-4-13-1-29 8-48l25-49 16 8-28 61c-5 13-3 23 6 30 9 7 20 8 31 2l15-8-12 29c-16 13-36 19-61 18z" fill="#0c3038"/>
  <path d="M271 450c8-37 26-67 52-91 25-23 53-37 84-42 30-5 56 1 78 17 20 14 38 35 56 61l32 55z" fill="#0a222c" opacity=".92"/>
  <!-- subtle rim light along knuckles and fingertips -->
  <path d="M520 151l-31 60c-7 14-7 24 1 31M575 144l-41 84c-5 11-3 18 5 23M631 163l-43 73c-5 9-3 16 5 21M673 202l-41 54c-5 7-4 13 4 18" fill="none" stroke="url(#fingerEdge)" stroke-width="5" stroke-linecap="round"/>
  <path d="M311 357c31-23 62-34 94-33 30 1 53 14 73 37M293 386c35-22 66-31 94-29 25 2 48 14 68 35" fill="none" stroke="#5c8e8c" stroke-width="2" opacity=".18"/>
  <path d="M446 263c-13 9-27 13-42 13M466 283c-16 12-33 17-51 16" fill="none" stroke="#6c9d96" stroke-width="2" opacity=".2"/>

  <!-- rain in the immediate pane: sharper over the hand, softer elsewhere -->
  <g clip-path="url(#windowClip)" fill="none" stroke-linecap="round">
    <g stroke="#a5cfca" opacity=".32" stroke-width="2">
      <path d="M72 25l-28 132M154 30l-23 111M231 25l-35 166M318 30l-24 122M389 26l-35 172M474 26l-28 136M553 25l-22 126M628 30l-34 174M727 25l-27 151"/>
      <path d="M112 220l-32 151M272 207l-25 130M363 246l-28 147M513 205l-35 170M601 230l-28 153M748 203l-34 170"/>
    </g>
    <g stroke="#d3eee4" opacity=".58" stroke-width=".85">
      <path d="M48 71l-16 80M95 191l-17 84M175 64l-14 70M253 111l-21 104M303 19l-12 63M351 160l-18 93M425 33l-14 77M459 189l-17 91M535 92l-15 74M582 34l-13 66M652 141l-17 95M708 72l-14 87M750 278l-18 91"/>
    </g>
    <g fill="#c9e5db" stroke="none" opacity=".5">
      <ellipse cx="71" cy="173" rx="2" ry="7" transform="rotate(14 71 173)"/><ellipse cx="216" cy="233" rx="2" ry="8" transform="rotate(15 216 233)"/>
      <ellipse cx="393" cy="218" rx="2" ry="7" transform="rotate(14 393 218)"/><ellipse cx="538" cy="179" rx="2" ry="6" transform="rotate(13 538 179)"/>
      <ellipse cx="678" cy="253" rx="2" ry="7" transform="rotate(13 678 253)"/>
    </g>
  </g>

  <rect width="800" height="450" filter="url(#grain)" opacity=".64"/>
</svg>
