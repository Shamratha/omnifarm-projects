<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">The last signal — rain on amber windows</title>
  <desc id="desc">Rain and haze veil a dark building facade where a few amber windows glow like quiet rooms at night.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070d19"/>
      <stop offset=".45" stop-color="#111c2b"/>
      <stop offset="1" stop-color="#26384b"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#101825"/>
      <stop offset=".5" stop-color="#172131"/>
      <stop offset="1" stop-color="#080f1c"/>
    </linearGradient>
    <linearGradient id="windowAmber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd49a"/>
      <stop offset=".35" stop-color="#eea45e"/>
      <stop offset="1" stop-color="#a95738"/>
    </linearGradient>
    <linearGradient id="rainGlow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b8d5de" stop-opacity=".02"/>
      <stop offset=".42" stop-color="#b6d7dc" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6b9aab" stop-opacity=".04"/>
    </linearGradient>
    <radialGradient id="amberHalo">
      <stop stop-color="#f6b76c" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#bf6848" stop-opacity=".1"/>
      <stop offset="1" stop-color="#a94e3a" stop-opacity="0"/>
    </radialGradient>
    <filter id="bokeh" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="windowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="rainSoft" x="-20%" y="-10%" width="140%" height="120%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="31"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#night)"/>
  <g filter="url(#bokeh)" opacity=".65">
    <circle cx="72" cy="90" r="13" fill="#6fa3b3"/><circle cx="135" cy="338" r="19" fill="#d18155"/>
    <circle cx="730" cy="105" r="17" fill="#799fac"/><circle cx="758" cy="322" r="22" fill="#ca7757"/>
    <circle cx="565" cy="382" r="11" fill="#7199a3"/><circle cx="51" cy="270" r="7" fill="#b2c5c4"/>
  </g>

  <!-- faceted building plane, set off-axis against the frame -->
  <path d="M103 0h622l75 83v367H51V74z" fill="#050a13" opacity=".68"/>
  <path d="M155 0h570l75 83v367H108V75z" fill="url(#wall)"/>
  <path d="M155 0h570l75 83H108z" fill="#1b2b3a" opacity=".45"/>
  <path d="M211 0v450M367 0v450M527 0v450M685 0v450" stroke="#0b121f" stroke-width="8" opacity=".8"/>
  <path d="M115 79h685M109 198h691M108 319h692" stroke="#263545" stroke-width="4" opacity=".68"/>
  <path d="M148 0l-40 76v374M719 0l81 82" fill="none" stroke="#344451" stroke-width="2" opacity=".34"/>

  <!-- amber rooms, deliberately uneven -->
  <g>
    <circle cx="306" cy="93" r="95" fill="url(#amberHalo)" filter="url(#windowSoft)"/>
    <circle cx="601" cy="260" r="92" fill="url(#amberHalo)" filter="url(#windowSoft)" opacity=".8"/>
    <g fill="url(#windowAmber)">
      <path d="M180 35h67v67h-67z"/><path d="M278 34h61v65h-61z" opacity=".72"/>
      <path d="M425 40h70v66h-70z" opacity=".2"/><path d="M565 25h79v75h-79z" opacity=".42"/>
      <path d="M207 133h58v64h-58z" opacity=".22"/><path d="M294 132h70v65h-70z" opacity=".95"/>
      <path d="M465 132h69v64h-69z" opacity=".32"/><path d="M581 134h73v63h-73z" opacity=".16"/>
      <path d="M153 240h72v65h-72z" opacity=".15"/><path d="M280 239h64v66h-64z" opacity=".35"/>
      <path d="M398 241h69v65h-69z" opacity=".18"/><path d="M548 238h77v68h-77z"/>
      <path d="M679 240h72v65h-72z" opacity=".22"/>
      <path d="M188 351h69v65h-69z" opacity=".2"/><path d="M323 351h69v65h-69z" opacity=".12"/>
      <path d="M455 350h74v66h-74z" opacity=".28"/><path d="M609 350h69v65h-69z" opacity=".11"/>
    </g>
    <g stroke="#3d2926" stroke-width="5" opacity=".7">
      <path d="M180 68h67M213 35v67M278 66h61M309 34v65M294 164h70M329 132v65M548 272h77M586 238v68"/>
    </g>
    <g fill="#fff0ba" opacity=".68">
      <rect x="190" y="48" width="8" height="17"/><rect x="220" y="76" width="11" height="7"/>
      <rect x="307" y="147" width="18" height="4"/><rect x="310" y="158" width="11" height="3"/>
      <rect x="569" y="254" width="5" height="24"/><rect x="596" y="289" width="13" height="5"/>
    </g>
  </g>

  <!-- foreground mullions and a rain-slick ledge -->
  <g fill="#080e1a" opacity=".92">
    <path d="M130 0h14v450h-14zM259 0h12v450h-12zM356 0h14v450h-14zM494 0h13v450h-13zM651 0h14v450h-14zM744 0h15v450h-15z"/>
    <path d="M94 102h706v12H94zM94 213h706v11H94zM94 331h706v13H94z"/>
  </g>
  <path d="M0 420c169-16 284 10 423-4 141-14 257 3 377-11v45H0z" fill="#070d16"/>
  <path d="M0 421c166-14 284 10 423-4 141-14 257 3 377-11" fill="none" stroke="#78929a" stroke-width="2" opacity=".22"/>

  <!-- glass rain: a mixture of sharp tracks, beads and dragged reflections -->
  <g fill="none" stroke-linecap="round">
    <g stroke="url(#rainGlow)" stroke-width="2.2" opacity=".74">
      <path d="M42 12l-22 106M87 67L64 183M119 201l-25 120M169 9l-22 107M222 176l-29 151M249 290l-17 85M388 22l-25 121M409 165l-27 124M462 270l-16 97M540 8l-20 114M579 91l-29 142M627 316l-18 94M699 34l-24 116M760 185l-29 143"/>
      <path d="M18 346l-15 63M333 327l-19 91M511 365l-13 55M778 343l-18 79"/>
    </g>
    <g stroke="#d3e5e2" stroke-width=".9" opacity=".48">
      <path d="M53 24l-13 59M104 121l-17 83M151 258l-14 64M185 41l-16 75M236 12l-12 62M272 262l-13 59M347 8l-13 67M394 278l-13 72M451 79l-16 90M477 205l-14 70M526 236l-15 88M568 14l-17 93M612 180l-13 76M674 235l-18 84M718 74l-13 70M791 61l-17 88"/>
    </g>
    <g stroke="#e3d3b5" stroke-width="1.7" opacity=".35" filter="url(#rainSoft)">
      <path d="M76 4l-22 129M203 122l-25 127M378 339l-16 78M583 256l-20 123M731 173l-22 127"/>
    </g>
  </g>
  <g fill="#d8e6df" opacity=".55">
    <ellipse cx="64" cy="182" rx="2.3" ry="7" transform="rotate(13 64 182)"/><ellipse cx="180" cy="336" rx="2" ry="5" transform="rotate(16 180 336)"/>
    <ellipse cx="331" cy="125" rx="2" ry="6" transform="rotate(14 331 125)"/><ellipse cx="519" cy="144" rx="2" ry="6" transform="rotate(12 519 144)"/>
    <ellipse cx="689" cy="367" rx="2" ry="7" transform="rotate(15 689 367)"/><ellipse cx="746" cy="161" rx="2" ry="5" transform="rotate(13 746 161)"/>
  </g>
  <rect width="800" height="450" filter="url(#grain)" opacity=".64"/>
</svg>
