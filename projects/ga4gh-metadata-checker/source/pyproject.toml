[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ga4gh-metadata-checker"
version = "0.1.0"
description = "Local, synthetic GA4GH-style genomic metadata quality checker"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ga4gh-qc = "ga4gh_qc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
